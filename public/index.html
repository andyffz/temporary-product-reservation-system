<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#007AFF">
  <title>云仓特惠 · 团购预订</title>
  <style>
    :root {
      --primary: #007AFF;
      --primary-hover: #0056B3;
      --primary-soft: rgba(0, 122, 255, 0.08);
      --bg: #F2F2F7;
      --fg: #1D1D1F;
      --card: #FFFFFF;
      --muted: #86868B;
      --muted-bg: #F2F2F7;
      --border: rgba(60, 60, 67, 0.1);
      --warn: #FF9500;
      --warn-soft: rgba(255, 149, 0, 0.1);
      --danger: #FF3B30;
      --danger-soft: rgba(255, 59, 48, 0.08);
      --success: #34C759;
      --success-soft: rgba(52, 199, 89, 0.1);
      --radius: 14px;
      --radius-sm: 10px;
      --shadow-1: 0 0.5px 0 rgba(0,0,0,0.04);
      --shadow-2: 0 2px 12px rgba(0,0,0,0.06);
      --font: -apple-system, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
      --touch: 44px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }
    .view { display: none; }
    .view.active { display: block; }

    /* === 通用导航栏 === */
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,0.92);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 0.5px solid var(--border);
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
      min-height: 52px;
    }
    .nav-btn {
      background: none; border: none; color: var(--primary);
      font-size: 16px; font-family: var(--font); cursor: pointer;
      padding: 6px 4px; min-height: var(--touch); display: flex; align-items: center;
    }
    .nav-title { font-size: 17px; font-weight: 600; }
    .nav-spacer { width: 60px; }

    /* === 预订大厅 === */
    .hall-header {
      background: linear-gradient(135deg, var(--primary) 0%, #5856D6 100%);
      color: #fff; padding: 24px 20px 28px;
    }
    .hall-header h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px; letter-spacing: -.02em; }
    .hall-header p { margin: 0; opacity: .85; font-size: 13px; }
    .hall-list { padding: 16px; }
    .campaign-card {
      background: var(--card); border-radius: var(--radius);
      padding: 18px 16px; margin-bottom: 12px;
      box-shadow: var(--shadow-2); cursor: pointer;
      transition: transform .15s;
    }
    .campaign-card:active { transform: scale(.98); }
    .campaign-card .name { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
    .campaign-card .meta { display: flex; gap: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
    .campaign-card .meta span { display: inline-flex; align-items: center; gap: 3px; }
    .status-badge {
      display: inline-block; font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 6px; margin-bottom: 8px;
    }
    .status-active { background: var(--success-soft); color: var(--success); }
    .status-closed { background: var(--muted-bg); color: var(--muted); }
    .status-fulfilled { background: var(--primary-soft); color: var(--primary); }
    .countdown { color: var(--warn); font-weight: 600; font-size: 13px; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }

    /* === 团单详情 - 商品列表 === */
    .detail-header {
      background: var(--card); padding: 16px 20px;
      border-bottom: 0.5px solid var(--border);
    }
    .detail-header .title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .detail-header .desc { font-size: 13px; color: var(--muted); }
    .product-list { padding: 8px 0 120px; }
    .product-item {
      background: var(--card); margin: 8px 16px; border-radius: var(--radius);
      padding: 14px 16px; box-shadow: var(--shadow-1);
    }
    .product-item.soldout { opacity: .5; }
    .product-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .product-info { flex: 1; min-width: 0; }
    .product-name { font-size: 16px; font-weight: 600; margin-bottom: 2px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .promo-tag {
      font-size: 10px; font-weight: 600; padding: 2px 6px;
      border-radius: 4px; white-space: nowrap;
    }
    .promo-buyGet { background: var(--warn-soft); color: var(--warn); }
    .promo-tiered { background: var(--primary-soft); color: var(--primary); }
    .product-spec { font-size: 12px; color: var(--muted); }
    .product-price { font-size: 17px; font-weight: 700; color: var(--fg); margin-top: 4px; }
    .product-price .old-price { font-size: 13px; color: var(--muted); text-decoration: line-through; font-weight: 400; margin-left: 4px; }
    .product-date { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .product-date.expired { color: var(--danger); }
    .qty-control { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .qty-btn {
      width: 48px; height: 48px; border-radius: 50%;
      border: none; font-size: 26px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .15s;
    }
    .qty-btn.minus { background: var(--muted-bg); color: var(--fg); border: 0.5px solid var(--border); }
    .qty-btn.plus { background: var(--primary); color: #fff; }
    .qty-btn:disabled { opacity: .3; cursor: not-allowed; }
    .qty-btn:active:not(:disabled) { transform: scale(.9); }
    .qty-val { font-size: 20px; font-weight: 700; min-width: 32px; text-align: center; }
    .product-gift-hint { font-size: 12px; color: var(--warn); margin-top: 6px; font-weight: 500; }
    .stock-bar { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .stock-bar .low { color: var(--danger); }

    /* === 浮动购物车栏 === */
    .cart-bar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px;
      background: var(--card); border-top: 0.5px solid var(--border);
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      z-index: 90; box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
      transition: transform .3s, opacity .3s;
    }
    .cart-bar.hidden { transform: translateX(-50%) translateY(100%); opacity: 0; }
    .cart-info { flex: 1; }
    .cart-total { font-size: 20px; font-weight: 700; color: var(--fg); }
    .cart-total .currency { font-size: 14px; }
    .cart-detail { font-size: 12px; color: var(--muted); }
    .cart-checkout-btn {
      background: var(--primary); color: #fff; border: none;
      padding: 12px 28px; border-radius: 22px;
      font-size: 16px; font-weight: 600; font-family: var(--font);
      cursor: pointer; transition: all .15s;
    }
    .cart-checkout-btn:active { transform: scale(.96); }
    .cart-checkout-btn:disabled { opacity: .4; }

    /* === 结算页 === */
    .checkout-section { padding: 12px 16px; }
    .checkout-section h3 {
      font-size: 13px; color: var(--muted); font-weight: 500;
      text-transform: uppercase; letter-spacing: .05em;
      margin: 16px 4px 8px;
    }
    .checkout-card {
      background: var(--card); border-radius: var(--radius);
      padding: 4px 16px; box-shadow: var(--shadow-1);
    }
    .checkout-item {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 12px 0; border-bottom: 0.5px solid var(--border);
    }
    .checkout-item:last-child { border-bottom: none; }
    .checkout-item .ci-name { font-weight: 500; font-size: 15px; }
    .checkout-item .ci-detail { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .checkout-item .ci-subtotal { font-weight: 600; font-size: 15px; text-align: right; white-space: nowrap; }
    .checkout-summary {
      display: flex; justify-content: space-between;
      padding: 14px 0; font-size: 17px; font-weight: 700;
    }
    .checkout-form { background: var(--card); border-radius: var(--radius); padding: 4px 16px; box-shadow: var(--shadow-1); }
    .form-row { display: flex; align-items: center; padding: 12px 0; border-bottom: 0.5px solid var(--border); }
    .form-row:last-child { border-bottom: none; }
    .form-row label { font-size: 15px; width: 80px; flex-shrink: 0; }
    .form-row input {
      border: none; outline: none; font-size: 15px; font-family: var(--font);
      flex: 1; background: transparent; color: var(--fg);
    }
    .form-row input::placeholder { color: var(--muted); }
    .submit-btn {
      width: calc(100% - 32px); margin: 20px 16px;
      background: var(--primary); color: #fff; border: none;
      padding: 15px; border-radius: var(--radius);
      font-size: 17px; font-weight: 600; font-family: var(--font);
      cursor: pointer; transition: all .15s;
      position: sticky; bottom: 16px;
    }
    .submit-btn:active { transform: scale(.98); }
    .submit-btn:disabled { opacity: .4; }

    /* === 本期订单 === */
    .orders-tabs { display: flex; background: var(--card); border-bottom: 0.5px solid var(--border); padding: 0 16px; }
    .orders-tab { padding: 12px 20px; font-size: 15px; font-weight: 500; color: var(--muted); border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; font-family: var(--font); }
    .orders-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .orders-tab .count { font-size: 12px; color: var(--muted); margin-left: 4px; }
    .orders-tab.active .count { color: var(--primary); }
    .order-group { margin: 0 16px 16px; }
    .order-group-title { font-size: 13px; color: var(--muted); font-weight: 500; margin: 12px 4px 8px; }
    .order-card {
      background: var(--card); border-radius: var(--radius);
      padding: 14px 16px; margin-bottom: 8px; box-shadow: var(--shadow-1);
    }
    .order-card .oc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .order-card .oc-name { font-weight: 600; font-size: 15px; }
    .order-card .oc-code { font-size: 12px; color: var(--primary); font-weight: 600; font-family: monospace; }
    .order-card .oc-items { font-size: 13px; color: var(--muted); line-height: 1.6; }
    .order-card .oc-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding-top: 8px; border-top: 0.5px solid var(--border); }
    .order-card .oc-total { font-weight: 700; font-size: 16px; }
    .order-card .oc-time { font-size: 11px; color: var(--muted); }

    /* === 成功弹窗 === */
    .modal-mask {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 200; display: none; align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-mask.show { display: flex; }
    .modal-card {
      background: var(--card); border-radius: 20px;
      padding: 32px 24px; max-width: 340px; width: 100%;
      text-align: center;
    }
    .modal-card .check { font-size: 48px; color: var(--success); margin-bottom: 12px; }
    .modal-card h2 { font-size: 20px; margin: 0 0 16px; }
    .modal-card .pickup-code {
      font-size: 32px; font-weight: 800; font-family: monospace;
      color: var(--primary); letter-spacing: 4px;
      background: var(--primary-soft); padding: 16px; border-radius: var(--radius);
      margin: 16px 0;
    }
    .modal-card .order-summary { font-size: 13px; color: var(--muted); text-align: left; margin: 12px 0; }
    .modal-card .order-summary div { display: flex; justify-content: space-between; padding: 4px 0; }
    .modal-card .btn-close {
      width: 100%; background: var(--primary); color: #fff; border: none;
      padding: 14px; border-radius: var(--radius); font-size: 16px;
      font-weight: 600; font-family: var(--font); cursor: pointer; margin-top: 16px;
    }

    /* === Toast === */
    .toast {
      position: fixed; top: 60px; left: 50%; transform: translateX(-50%) translateY(-20px);
      background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px;
      border-radius: 20px; font-size: 14px; z-index: 300;
      opacity: 0; transition: all .3s; pointer-events: none;
      max-width: 90%; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.warn { background: rgba(255,149,0,0.9); }
    .toast.success { background: rgba(52,199,89,0.9); }
  </style>
</head>

<body>
<div class="app">

  <!-- ========== 预订大厅 ========== -->
  <section id="view-hall" class="view active">
    <div class="hall-header">
      <h1>云仓特惠</h1>
      <p>内部团购预订平台</p>
    </div>
    <div class="nav">
      <div class="nav-spacer"></div>
      <div class="nav-title">预订大厅</div>
      <button class="nav-btn" onclick="showView('myOrders')">本期订单</button>
    </div>
    <div class="hall-list" id="campaign-list">
      <div class="empty-state"><div class="icon"> </div><p>加载中...</p></div>
    </div>
  </section>

  <!-- ========== 团单详情 ========== -->
  <section id="view-detail" class="view">
    <div class="nav">
      <button class="nav-btn" onclick="showView('hall')">‹ 返回</button>
      <div class="nav-title" id="detail-title">团单详情</div>
      <div class="nav-spacer"></div>
    </div>
    <div class="detail-header">
      <div class="title" id="detail-campaign-name"></div>
      <div class="desc" id="detail-campaign-desc"></div>
    </div>
    <div class="product-list" id="product-list"></div>
    <div class="cart-bar hidden" id="cart-bar">
      <div class="cart-info">
        <div class="cart-total"><span class="currency">¥</span><span id="cart-total-val">0</span></div>
        <div class="cart-detail" id="cart-detail"></div>
      </div>
      <button class="cart-checkout-btn" onclick="showView('checkout')">去结算</button>
    </div>
  </section>

  <!-- ========== 结算页 ========== -->
  <section id="view-checkout" class="view">
    <div class="nav">
      <button class="nav-btn" onclick="showView('detail')">‹ 返回</button>
      <div class="nav-title">确认订单</div>
      <div class="nav-spacer"></div>
    </div>
    <div class="checkout-section">
      <h3>预订清单</h3>
      <div class="checkout-card" id="checkout-items"></div>
      <h3>联系方式</h3>
      <div class="checkout-form">
        <div class="form-row"><label>姓名 *</label><input id="form-name" placeholder="请输入姓名"></div>
        <div class="form-row"><label>电话</label><input id="form-contact" placeholder="选填，用于查询订单"></div>
        <div class="form-row"><label>备注</label><input id="form-note" placeholder="选填"></div>
      </div>
      <button class="submit-btn" id="submit-btn" onclick="submitOrder()">提交预订</button>
    </div>
  </section>

  <!-- ========== 本期订单 ========== -->
  <section id="view-myOrders" class="view">
    <div class="nav">
      <button class="nav-btn" onclick="showView('hall')">‹ 返回</button>
      <div class="nav-title">本期订单</div>
      <div class="nav-spacer"></div>
    </div>
    <div class="orders-tabs">
      <button class="orders-tab active" id="tab-pending" onclick="switchOrdersTab('pending')">未取订单<span class="count" id="count-pending"></span></button>
      <button class="orders-tab" id="tab-pickedUp" onclick="switchOrdersTab('pickedUp')">已取订单<span class="count" id="count-pickedUp"></span></button>
    </div>
    <div id="my-orders-result" style="padding: 12px 16px;"></div>
  </section>

</div>

<!-- 成功弹窗 -->
<div class="modal-mask" id="success-modal">
  <div class="modal-card">
    <div class="check"> </div>
    <h2>预订成功</h2>
    <div style="font-size:13px;color:var(--muted);">请保存取货码，凭码取货</div>
    <div class="pickup-code" id="success-code"></div>
    <div class="order-summary" id="success-summary"></div>
    <button class="btn-close" onclick="closeModal()">完成</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ========== 全局状态 ==========
const App = {
  campaigns: [],
  currentCampaign: null,
  currentProducts: [],
  currentStock: {},
  cart: {}, // { productId: qty }
  lastContact: JSON.parse(localStorage.getItem('lastContact') || '{}')
};

// ========== 算价引擎（前端镜像） ==========
function calcGift(rules, qty) {
  if (!rules || rules.type !== 'buyGet') return 0;
  if (qty < rules.buy) return 0;
  return Math.floor(qty / rules.buy) * (rules.get || 1);
}
function calcTake(product, rules, qty) {
  return qty + calcGift(rules, qty);
}
function calcPrice(product, rules, qty) {
  let unitPrice = product.price;
  if (rules && rules.type === 'tiered' && Array.isArray(rules.tiers) && rules.tiers.length > 0) {
    const sorted = [...rules.tiers].sort((a, b) => b.minQty - a.minQty);
    const tier = sorted.find(t => qty >= t.minQty);
    if (tier) unitPrice = tier.price;
  }
  if (product.step > 1) return (qty / product.step) * unitPrice;
  return qty * unitPrice;
}
function describePromotion(rules) {
  if (!rules || rules.type === 'none') return '';
  if (rules.type === 'buyGet') return `买${rules.buy}赠${rules.get}`;
  if (rules.type === 'tiered' && Array.isArray(rules.tiers)) {
    return [...rules.tiers].sort((a,b)=>a.minQty-b.minQty).map(t=>`满${t.minQty}件${t.price}元`).join('，');
  }
  return '';
}
function checkTriggered(rules, qty) {
  if (!rules || rules.type === 'none') return null;
  if (rules.type === 'buyGet' && qty >= rules.buy) {
    return `已达买${rules.buy}赠${rules.get}标准，赠${calcGift(rules, qty)}件`;
  }
  if (rules.type === 'tiered' && Array.isArray(rules.tiers)) {
    const sorted = [...rules.tiers].sort((a, b) => b.minQty - a.minQty);
    const tier = sorted.find(t => qty >= t.minQty);
    if (tier) return `已享阶梯价：${tier.minQty}件以上${tier.price}元`;
  }
  return null;
}

// ========== API 调用 ==========
async function api(url, options) {
  try {
    const res = await fetch(url, options);
    return await res.json();
  } catch (e) {
    return { error: '网络错误，请稍后重试' };
  }
}

// ========== 视图切换 ==========
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  window.scrollTo(0, 0);
  if (name === 'hall') loadCampaigns();
  if (name === 'checkout') renderCheckout();
}

// ========== 预订大厅 ==========
async function loadCampaigns() {
  const data = await api('/api/campaigns');
  if (data.error) {
    document.getElementById('campaign-list').innerHTML = `<div class="empty-state"><p>${data.error}</p></div>`;
    return;
  }
  App.campaigns = data.campaigns || [];
  renderCampaigns();
}

function renderCampaigns() {
  const el = document.getElementById('campaign-list');
  if (App.campaigns.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="icon"> </div><p>暂无进行中的团单</p></div>';
    return;
  }
  el.innerHTML = App.campaigns.map(c => {
    const statusClass = c.status === 'active' ? 'status-active' : c.status === 'closed' ? 'status-closed' : 'status-fulfilled';
    const statusText = c.status === 'active' ? '进行中' : c.status === 'closed' ? '已截单' : '已履约';
    const countdown = c.endTime ? formatCountdown(c.endTime) : '';
    return `
      <div class="campaign-card" onclick="openCampaign(${c.id})">
        <div class="status-badge ${statusClass}">${statusText}</div>
        <div class="name">${escapeHtml(c.name)}</div>
        <div class="meta">
          <span> ${c.productCount || 0} 款商品</span>
          <span> ${c.orderCount || 0} 单</span>
          ${countdown ? `<span class="countdown"> ${countdown}</span>` : ''}
        </div>
        ${c.description ? `<div style="font-size:12px;color:var(--muted);margin-top:6px;">${escapeHtml(c.description)}</div>` : ''}
      </div>`;
  }).join('');
}

function formatCountdown(endTime) {
  if (!endTime) return '';
  const end = new Date(endTime.replace(/-/g, '/'));
  const diff = end - Date.now();
  if (diff <= 0) return '已结束';
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  if (d > 0) return `剩${d}天${h}时`;
  if (h > 0) return `剩${h}时${m}分`;
  return `剩${m}分`;
}

// ========== 团单详情 ==========
async function openCampaign(id) {
  const data = await api(`/api/state?campaignId=${id}`);
  if (data.error) { showToast(data.error); return; }

  App.currentCampaign = data.campaign;
  App.currentProducts = data.products || [];
  App.currentStock = data.stock || {};
  App.cart = {};

  document.getElementById('detail-campaign-name').textContent = data.campaign.name;
  document.getElementById('detail-campaign-desc').textContent = data.campaign.description || '';
  document.getElementById('detail-title').textContent = data.campaign.name;

  renderProducts();
  updateCartBar();
  showView('detail');
}

function renderProducts() {
  const el = document.getElementById('product-list');
  const products = App.currentProducts;

  // 售罄置底
  const sorted = [...products].sort((a, b) => {
    const ra = App.currentStock[a.id] ?? a.total;
    const rb = App.currentStock[b.id] ?? b.total;
    if (ra <= 0 && rb > 0) return 1;
    if (rb <= 0 && ra > 0) return -1;
    return 0;
  });

  el.innerHTML = sorted.map(p => {
    const remain = App.currentStock[p.id] ?? p.total;
    const soldout = remain <= 0;
    const rules = p.promotionRules || { type: 'none' };
    const promoDesc = describePromotion(rules);
    const qty = App.cart[p.id] || 0;
    const gift = calcGift(rules, qty);
    const triggered = checkTriggered(rules, qty);

    let priceDisplay = '';
    if (p.step > 1) {
      priceDisplay = `<span class="product-price">¥${p.price}<span style="font-size:12px;color:var(--muted);font-weight:400;"> / ${p.step}${p.unit}</span></span>`;
    } else {
      priceDisplay = `<span class="product-price">¥${p.price}<span style="font-size:12px;color:var(--muted);font-weight:400;"> / ${p.unit}</span></span>`;
    }

    // 阶梯价显示最低价
    if (rules.type === 'tiered' && rules.tiers) {
      const minPrice = Math.min(...rules.tiers.map(t => t.price));
      priceDisplay = `<span class="product-price">¥${minPrice}<span class="old-price">¥${p.price}</span><span style="font-size:12px;color:var(--muted);font-weight:400;"> / ${p.unit}起</span></span>`;
    }

    let promoTag = '';
    if (rules.type === 'buyGet') promoTag = `<span class="promo-tag promo-buyGet">${promoDesc}</span>`;
    else if (rules.type === 'tiered') promoTag = `<span class="promo-tag promo-tiered">${promoDesc}</span>`;

    return `
      <div class="product-item ${soldout ? 'soldout' : ''}">
        <div class="product-top">
          <div class="product-info">
            <div class="product-name">${escapeHtml(p.name)} ${promoTag}</div>
            <div class="product-spec">${p.unit} · ${p.priceLabel || ''}</div>
            ${priceDisplay}
            ${p.date ? `<div class="product-date ${p.dateType === 'expired' ? 'expired' : ''}">${p.dateType === 'expired' ? '已过期' : ''} ${p.date}</div>` : ''}
            ${p.note ? `<div class="product-date">${escapeHtml(p.note)}</div>` : ''}
            <div class="stock-bar ${remain <= 3 && remain > 0 ? 'low' : ''}">${soldout ? '已售罄' : `剩余 ${remain}${p.unit}`}</div>
          </div>
          <div class="qty-control">
            <button class="qty-btn minus" onclick="changeQty(${p.id}, -${p.step || 1})" ${qty <= 0 ? 'disabled' : ''}>−</button>
            <span class="qty-val">${qty}</span>
            <button class="qty-btn plus" onclick="changeQty(${p.id}, ${p.step || 1})" ${soldout ? 'disabled' : ''}>+</button>
          </div>
        </div>
        ${triggered ? `<div class="product-gift-hint"> ${triggered}</div>` : ''}
      </div>`;
  }).join('');
}

function changeQty(productId, delta) {
  const p = App.currentProducts.find(x => x.id === productId);
  if (!p) return;
  const rules = p.promotionRules || { type: 'none' };
  const step = p.step || 1;
  const remain = App.currentStock[productId] ?? p.total;
  const current = App.cart[productId] || 0;
  const newVal = current + delta;

  if (newVal <= 0) {
    delete App.cart[productId];
    renderProducts();
    updateCartBar();
    return;
  }

  if (newVal % step !== 0) {
    showToast(`需按 ${step} 的倍数选择`);
    return;
  }

  const take = calcTake(p, rules, newVal);
  if (take > remain) {
    const gift = calcGift(rules, newVal);
    showToast(`「${p.name}」剩余 ${remain}，选 ${newVal} 需 ${take}（含赠品 ${gift}）`, 'warn');
    return;
  }

  App.cart[productId] = newVal;

  // 检查优惠触发
  const triggered = checkTriggered(rules, newVal);
  if (triggered && delta > 0) showToast(triggered, 'success');

  renderProducts();
  updateCartBar();
}

// ========== 浮动购物车栏 ==========
function updateCartBar() {
  const bar = document.getElementById('cart-bar');
  const ids = Object.keys(App.cart);
  if (ids.length === 0) {
    bar.classList.add('hidden');
    return;
  }

  let totalQty = 0;
  let totalAmount = 0;
  let totalGift = 0;

  for (const [id, qty] of Object.entries(App.cart)) {
    const p = App.currentProducts.find(x => x.id === Number(id));
    if (!p) continue;
    const rules = p.promotionRules || { type: 'none' };
    totalQty += qty;
    totalAmount += calcPrice(p, rules, qty);
    totalGift += calcGift(rules, qty);
  }

  bar.classList.remove('hidden');
  document.getElementById('cart-total-val').textContent = totalAmount.toFixed(2).replace(/\.00$/, '');
  let detail = `共 ${totalQty} 件`;
  if (totalGift > 0) detail += ` · 赠 ${totalGift} 件`;
  document.getElementById('cart-detail').textContent = detail;
}

// ========== 结算页 ==========
function renderCheckout() {
  const el = document.getElementById('checkout-items');
  const ids = Object.keys(App.cart);
  if (ids.length === 0) {
    showView('detail');
    return;
  }

  let html = '';
  let totalAmount = 0;
  let totalGift = 0;

  for (const [id, qty] of Object.entries(App.cart)) {
    const p = App.currentProducts.find(x => x.id === Number(id));
    if (!p) continue;
    const rules = p.promotionRules || { type: 'none' };
    const subtotal = calcPrice(p, rules, qty);
    const gift = calcGift(rules, qty);
    totalAmount += subtotal;
    totalGift += gift;

    let detailParts = [`×${qty} ${p.unit}`];
    if (gift > 0) detailParts.push(`赠${gift}`);
    const promoDesc = describePromotion(rules);
    if (promoDesc) detailParts.push(promoDesc);

    html += `
      <div class="checkout-item">
        <div>
          <div class="ci-name">${escapeHtml(p.name)}</div>
          <div class="ci-detail">${detailParts.join(' · ')}</div>
        </div>
        <div class="ci-subtotal">¥${subtotal.toFixed(2).replace(/\.00$/, '')}</div>
      </div>`;
  }

  html += `
    <div class="checkout-summary">
      <span>合计${totalGift > 0 ? ` <span style="font-size:13px;color:var(--muted);font-weight:400;">(赠${totalGift}件)</span>` : ''}</span>
      <span>¥${totalAmount.toFixed(2).replace(/\.00$/, '')}</span>
    </div>`;

  el.innerHTML = html;

  // 自动填充上次联系方式
  document.getElementById('form-name').value = App.lastContact.name || '';
  document.getElementById('form-contact').value = App.lastContact.contact || '';
  document.getElementById('form-note').value = '';
}

// ========== 提交订单 ==========
async function submitOrder() {
  const name = document.getElementById('form-name').value.trim();
  const contact = document.getElementById('form-contact').value.trim();
  const note = document.getElementById('form-note').value.trim();

  if (!name) { showToast('请填写姓名', 'warn'); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '提交中...';

  const items = Object.entries(App.cart).map(([id, qty]) => ({ id: Number(id), qty }));

  const data = await api('/api/order', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      campaignId: App.currentCampaign.id,
      name, contact, note, items
    })
  });

  btn.disabled = false;
  btn.textContent = '提交预订';

  if (data.error) { showToast(data.error, 'warn'); return; }

  // 保存联系方式
  localStorage.setItem('lastContact', JSON.stringify({ name, contact }));
  App.lastContact = { name, contact };

  // 更新本地库存
  if (data.stock) App.currentStock = data.stock;

  // 清空购物车
  App.cart = {};

  // 显示成功弹窗
  showSuccessModal(data.order);
}

function showSuccessModal(order) {
  document.getElementById('success-code').textContent = order.pickupCode;
  const summary = order.items.map(it =>
    `<div><span>${escapeHtml(it.name)} ×${it.qty}${it.gift > 0 ? ` (赠${it.gift})` : ''}</span><span>¥${it.subtotal}</span></div>`
  ).join('');
  document.getElementById('success-summary').innerHTML = summary +
    `<div style="border-top:0.5px solid var(--border);margin-top:8px;padding-top:8px;font-weight:700;font-size:15px;color:var(--fg);"><span>合计</span><span>¥${order.total}</span></div>`;
  document.getElementById('success-modal').classList.add('show');
}

function closeModal() {
  document.getElementById('success-modal').classList.remove('show');
  showView('hall');
}

// ========== 我的预订 ==========
async function searchMyOrders() {
  const input = document.getElementById('search-input').value.trim();
  if (!input) { showToast('请输入姓名或电话', 'warn'); return; }

  const params = new URLSearchParams();
  // 智能判断：纯数字视为电话，否则视为姓名
  if (/^\d+$/.test(input)) params.set('contact', input);
  else params.set('name', input);

  const data = await api(`/api/myOrders?${params}`);
  if (data.error) {
    document.getElementById('my-orders-result').innerHTML = `<div class="empty-state"><p>${data.error}</p></div>`;
    return;
  }

  renderMyOrders(data.groups || []);
}

function renderMyOrders(groups) {
  const el = document.getElementById('my-orders-result');
  if (groups.length === 0) {
    el.innerHTML = '<div class="empty-state"><p>未找到相关订单</p></div>';
    return;
  }

  el.innerHTML = groups.map(g => {
    const orders = g.orders.map(o => {
      const statusText = o.pickedUp ? '已履约' : (g.campaignStatus === 'closed' ? '已截单' : '预订中');
      const statusClass = o.pickedUp ? 'status-fulfilled' : (g.campaignStatus === 'closed' ? 'status-closed' : 'status-active');
      const itemsText = o.items.map(it => `${it.name} ×${it.qty}${it.gift > 0 ? `(赠${it.gift})` : ''}`).join('，');
      return `
        <div class="order-card">
          <div class="oc-top">
            <span class="oc-name">${escapeHtml(o.name)}</span>
            <span class="oc-code">${o.pickupCode || ''}</span>
          </div>
          <div class="oc-items">${escapeHtml(itemsText)}</div>
          <div class="oc-bottom">
            <span class="oc-total">¥${o.total}</span>
            <span class="status-badge ${statusClass}">${statusText}</span>
          </div>
          <div class="oc-time">${o.time}</div>
        </div>`;
    }).join('');

    return `
      <div class="order-group">
        <div class="order-group-title">${escapeHtml(g.campaignName)}</div>
        ${orders}
      </div>`;
  }).join('');
}

// ========== 工具函数 ==========
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ========== 初始化 ==========
loadCampaigns();
