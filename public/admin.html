<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#007AFF">
  <title>管理后台 · 团购预订系统</title>
  <style>
    :root {
      --primary: #007AFF;
      --primary-hover: #0056B3;
      --primary-soft: rgba(0, 122, 255, 0.08);
      --bg: #F2F2F7;
      --fg: #1D1D1F;
      --card: #FFFFFF;
      --muted: #86868B;
      --muted-bg: #F2F2F7;
      --border: rgba(60, 60, 67, 0.1);
      --warn: #FF9500;
      --warn-soft: rgba(255, 149, 0, 0.1);
      --danger: #FF3B30;
      --danger-soft: rgba(255, 59, 48, 0.08);
      --success: #34C759;
      --success-soft: rgba(52, 199, 89, 0.1);
      --radius: 14px;
      --radius-sm: 10px;
      --shadow-1: 0 0.5px 0 rgba(0,0,0,0.04);
      --shadow-2: 0 2px 12px rgba(0,0,0,0.06);
      --font: -apple-system, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
      --touch: 44px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--fg); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

    /* === 登录 === */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { background: var(--card); border-radius: 20px; padding: 32px 24px; max-width: 360px; width: 100%; box-shadow: var(--shadow-2); }
    .login-card h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px; text-align: center; }
    .login-card p { font-size: 13px; color: var(--muted); text-align: center; margin: 0 0 24px; }
    .login-card input { width: 100%; padding: 12px 14px; border: 0.5px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; font-family: var(--font); margin-bottom: 12px; outline: none; }
    .login-card input:focus { border-color: var(--primary); }
    .login-card button { width: 100%; padding: 14px; border: none; border-radius: var(--radius-sm); background: var(--primary); color: #fff; font-size: 16px; font-weight: 600; font-family: var(--font); cursor: pointer; }
    .login-card .hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 16px; }

    /* === 主框架 === */
    .admin { display: none; }
    .admin.show { display: block; }
    .topbar { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 0.5px solid var(--border); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; min-height: 52px; }
    .topbar .title { font-size: 17px; font-weight: 600; }
    .topbar .actions { display: flex; gap: 8px; align-items: center; }
    .topbar .user-chip { font-size: 12px; color: var(--muted); background: var(--muted-bg); padding: 4px 10px; border-radius: 12px; }
    .btn { padding: 8px 16px; border: none; border-radius: var(--radius-sm); font-size: 14px; font-family: var(--font); cursor: pointer; transition: all .15s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-outline { background: var(--card); color: var(--primary); border: 0.5px solid var(--primary); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-sm { padding: 6px 12px; font-size: 13px; }
    .btn:active { transform: scale(.96); }
    .btn:disabled { opacity: .4; }

    /* === Tab 栏 === */
    .tab-bar { display: flex; background: var(--card); border-bottom: 0.5px solid var(--border); padding: 0 16px; overflow-x: auto; }
    .tab-item { padding: 12px 16px; font-size: 15px; font-weight: 500; color: var(--muted); border: none; background: none; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; font-family: var(--font); }
    .tab-item.active { color: var(--primary); border-bottom-color: var(--primary); }

    .tab-content { display: none; padding: 16px; }
    .tab-content.active { display: block; }

    /* === 通用卡片 === */
    .card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-1); }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }

    /* === 团单列表 === */
    .campaign-row { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; box-shadow: var(--shadow-1); cursor: pointer; transition: transform .15s; }
    .campaign-row:active { transform: scale(.98); }
    .campaign-row .cr-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .campaign-row .cr-name { font-size: 16px; font-weight: 600; }
    .campaign-row .cr-meta { font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
    .status-badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; }
    .status-active { background: var(--success-soft); color: var(--success); }
    .status-closed { background: var(--warn-soft); color: var(--warn); }
    .status-fulfilled { background: var(--primary-soft); color: var(--primary); }

    /* === 团单详情 === */
    .detail-back { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--primary); font-size: 15px; padding: 8px 0; }
    .detail-header { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-1); }
    .detail-header h2 { margin: 0 0 8px; font-size: 20px; }
    .detail-header .meta { font-size: 13px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
    .detail-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

    /* === 商品行（团单内） === */
    .cp-item { background: var(--card); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px; box-shadow: var(--shadow-1); }
    .cp-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .cp-info { flex: 1; }
    .cp-name { font-size: 15px; font-weight: 600; }
    .cp-spec { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .cp-stock { font-size: 12px; margin-top: 4px; }
    .cp-stock .remain { font-weight: 600; }
    .cp-stock .low { color: var(--danger); }
    .stock-ctl { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
    .stock-ctl button { width: 48px; height: 48px; border-radius: 50%; border: none; font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .15s; font-family: var(--font); }
    .stock-ctl button.minus { background: var(--muted-bg); color: var(--fg); border: 0.5px solid var(--border); }
    .stock-ctl button.plus { background: var(--primary); color: #fff; }
    .stock-ctl button:active { transform: scale(.9); }
    .stock-ctl input { width: 60px; text-align: center; border: 0.5px solid var(--border); border-radius: var(--radius-sm); height: 48px; font-size: 20px; font-weight: 700; font-family: var(--font); outline: none; }

    .promo-config { margin-top: 10px; padding-top: 10px; border-top: 0.5px solid var(--border); }
    .promo-config label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
    .promo-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .promo-row select, .promo-row input { padding: 6px 10px; border: 0.5px solid var(--border); border-radius: 6px; font-size: 13px; font-family: var(--font); outline: none; }
    .promo-row select:focus, .promo-row input:focus { border-color: var(--primary); }
    .promo-tiers { margin-top: 6px; }
    .promo-tier-row { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
    .promo-tier-row input { width: 70px; }
    .promo-tier-row button { width: 26px; height: 26px; border: none; background: var(--danger-soft); color: var(--danger); border-radius: 6px; cursor: pointer; font-size: 14px; }
    .promo-tag { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
    .promo-buyGet { background: var(--warn-soft); color: var(--warn); }
    .promo-tiered { background: var(--primary-soft); color: var(--primary); }

    /* === KPI === */
    .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
    @media (min-width: 640px) { .kpi-grid { grid-template-columns: repeat(4, 1fr); } }
    .kpi-card { background: var(--card); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow-1); }
    .kpi-label { font-size: 12px; color: var(--muted); }
    .kpi-value { font-size: 24px; font-weight: 700; margin-top: 2px; }

    /* === 表格 === */
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table th { text-align: left; padding: 8px 10px; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .data-table td { padding: 8px 10px; border-bottom: 0.5px solid var(--border); }
    .data-table tr:last-child td { border-bottom: none; }
    .table-wrap { background: var(--card); border-radius: var(--radius); padding: 4px 16px; box-shadow: var(--shadow-1); overflow-x: auto; }

    /* === 订单卡片 === */
    .order-row { background: var(--card); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px; box-shadow: var(--shadow-1); }
    .order-row.selected { border: 2px solid var(--primary); }
    .order-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .order-name { font-weight: 600; font-size: 15px; }
    .order-code { font-family: monospace; font-size: 13px; color: var(--primary); font-weight: 600; }
    .order-items { font-size: 13px; color: var(--muted); line-height: 1.6; }
    .order-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding-top: 8px; border-top: 0.5px solid var(--border); }
    .order-total { font-weight: 700; font-size: 16px; }
    .order-time { font-size: 11px; color: var(--muted); }
    .order-actions { display: flex; gap: 6px; }

    /* === 筛选栏 === */
    .filter-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .filter-bar select, .filter-bar input { padding: 8px 12px; border: 0.5px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-family: var(--font); background: var(--card); outline: none; }
    .filter-bar input { flex: 1; min-width: 120px; }

    /* === 订单子Tab === */
    .orders-tabs { display: flex; background: var(--muted-bg); border-radius: var(--radius-sm); padding: 3px; margin-bottom: 12px; }
    .orders-tab { flex: 1; padding: 8px 12px; border: none; background: none; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; transition: all .2s; font-family: var(--font); display: flex; align-items: center; justify-content: center; gap: 6px; }
    .orders-tab.active { background: var(--card); color: var(--fg); box-shadow: var(--shadow-1); font-weight: 600; }
    .orders-tab .count { background: var(--muted); color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 10px; min-width: 18px; text-align: center; }
    .orders-tab.active .count { background: var(--primary); }

    /* === 批量操作栏 === */
    .batch-bar { display: none; background: var(--primary-soft); border-radius: var(--radius); padding: 10px 16px; margin-bottom: 12px; align-items: center; justify-content: space-between; }
    .batch-bar.show { display: flex; }
    .batch-bar .info { font-size: 13px; color: var(--primary); font-weight: 500; }
    .batch-bar .actions { display: flex; gap: 6px; }

    /* === 弹窗 === */
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto; }
    .modal-mask.show { display: flex; }
    .modal-card { background: var(--card); border-radius: 20px; padding: 24px 20px; max-width: 400px; width: 100%; margin: auto; }
    .modal-card h2 { font-size: 18px; margin: 0 0 16px; }
    .modal-card .form-row { margin-bottom: 12px; }
    .modal-card .form-row label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    .modal-card .form-row input, .modal-card .form-row select { width: 100%; padding: 10px 12px; border: 0.5px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; font-family: var(--font); outline: none; }
    .modal-card .form-row input:focus, .modal-card .form-row select:focus { border-color: var(--primary); }
    .modal-card .btn-row { display: flex; gap: 8px; margin-top: 16px; }
    .modal-card .btn-row .btn { flex: 1; }
    .modal-card .product-pick { max-height: 400px; overflow-y: auto; }
    .modal-card .product-pick-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid var(--border); }
    .modal-card .product-pick-item:last-child { border-bottom: none; }
    .modal-card .product-pick-item input { width: 20px; height: 20px; }
    .modal-card .product-pick-item .info { flex: 1; }
    .modal-card .product-pick-item .name { font-weight: 500; }
    .modal-card .product-pick-item .spec { font-size: 12px; color: var(--muted); }

    /* === Toast === */
    .toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%) translateY(-20px); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 300; opacity: 0; transition: all .3s; pointer-events: none; max-width: 90%; text-align: center; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.warn { background: rgba(255,149,0,0.9); }
    .toast.success { background: rgba(52,199,89,0.9); }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
    .link { color: var(--primary); text-decoration: none; }
    .section-title { font-size: 13px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .05em; margin: 16px 4px 8px; }
  </style>
</head>

<body>

<!-- ========== 登录 ========== -->
<div class="login-wrap" id="loginView">
  <div class="login-card">
    <h1>管理后台</h1>
    <p>团购预订系统</p>
    <input id="login-user" placeholder="用户名" value="admin" onkeydown="if(event.key==='Enter')doLogin()">
    <input id="login-pass" type="password" placeholder="密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">登录</button>
    <div class="hint">默认账号 admin / admin123</div>
  </div>
</div>

<!-- ========== 管理主界面 ========== -->
<div class="admin" id="adminView">
  <div class="topbar">
    <div class="title">团购预订管理</div>
    <div class="actions">
      <span class="user-chip" id="user-chip"></span>
      <button class="btn btn-sm btn-outline" onclick="doLogout()">退出</button>
      <a class="btn btn-sm btn-outline" href="/" style="text-decoration:none;">下单页</a>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab-item active" onclick="switchTab('campaigns')">团单管理</button>
    <button class="tab-item" onclick="switchTab('products')">商品库</button>
    <button class="tab-item" onclick="switchTab('orders')">订单中心</button>
  </div>

  <!-- === Tab: 团单管理 === -->
  <div class="tab-content active" id="tab-campaigns">
    <div id="campaign-detail-view" style="display:none;"></div>
    <div id="campaign-list-view">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3 style="margin:0;font-size:17px;">团单列表</h3>
        <button class="btn btn-primary btn-sm" onclick="showCreateCampaignModal()">+ 新建团单</button>
      </div>
      <div id="campaign-list"></div>
    </div>
  </div>

  <!-- === Tab: 商品库 === -->
  <div class="tab-content" id="tab-products">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h3 style="margin:0;font-size:17px;">基础商品库</h3>
      <button class="btn btn-primary btn-sm" onclick="showProductModal()">+ 添加商品</button>
    </div>
    <div class="table-wrap">
      <table class="data-table" id="product-table">
        <thead><tr><th>名称</th><th>单位</th><th>价格</th><th>步进</th><th>日期</th><th>操作</th></tr></thead>
        <tbody id="product-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- === Tab: 订单中心 === -->
  <div class="tab-content" id="tab-orders">
    <div class="filter-bar">
      <select id="order-campaign-select" onchange="loadCampaignOrders()"></select>
      <input id="order-search" placeholder="搜索姓名/取货码" oninput="renderOrders()">
      <button class="btn btn-outline btn-sm" onclick="exportCSV()">导出CSV</button>
    </div>
    <div class="kpi-grid" id="order-kpi"></div>
    <div class="orders-tabs">
      <button class="orders-tab active" id="orders-tab-pending" onclick="switchOrdersTab('pending')">未取订单<span class="count" id="orders-count-pending">0</span></button>
      <button class="orders-tab" id="orders-tab-pickedUp" onclick="switchOrdersTab('pickedUp')">已取订单<span class="count" id="orders-count-pickedUp">0</span></button>
    </div>
    <div class="batch-bar" id="batch-bar">
      <span class="info" id="batch-info"></span>
      <div class="actions">
        <button class="btn btn-sm btn-primary" id="batch-pickup-btn" onclick="batchAction('pickup')">批量取货</button>
        <button class="btn btn-sm btn-outline" id="batch-cancel-btn" onclick="batchAction('cancelPickup')">取消取货</button>
        <button class="btn btn-sm btn-danger" onclick="batchAction('delete')">批量删除</button>
      </div>
    </div>
    <div id="order-list"></div>
  </div>
</div>

<!-- ========== 弹窗：新建团单 ========== -->
<div class="modal-mask" id="modal-campaign">
  <div class="modal-card">
    <h2>新建团单</h2>
    <div class="form-row"><label>团单名称 *</label><input id="cp-name" placeholder="如：第二期云仓特惠"></div>
    <div class="form-row"><label>截单时间</label><input id="cp-endtime" type="datetime-local"></div>
    <div class="form-row"><label>描述</label><input id="cp-desc" placeholder="选填"></div>
    <div class="btn-row">
      <button class="btn btn-outline" onclick="closeModal('modal-campaign')">取消</button>
      <button class="btn btn-primary" onclick="createCampaign()">创建</button>
    </div>
  </div>
</div>

<!-- ========== 弹窗：添加/编辑商品 ========== -->
<div class="modal-mask" id="modal-product">
  <div class="modal-card">
    <h2 id="product-modal-title">添加商品</h2>
    <div class="form-row"><label>名称 *</label><input id="p-name" placeholder="商品名称"></div>
    <div class="form-row"><label>单位</label><input id="p-unit" placeholder="包/罐/盒" value="个"></div>
    <div class="form-row"><label>单价 *</label><input id="p-price" type="number" step="0.01" placeholder="0.00"></div>
    <div class="form-row"><label>步进（1=任意数量，>1=按倍数）</label><input id="p-step" type="number" value="1"></div>
    <div class="form-row"><label>默认库存</label><input id="p-total" type="number" value="0"></div>
    <div class="form-row"><label>日期标注</label><input id="p-date" placeholder="如 2026.12"></div>
    <div class="form-row"><label>日期类型</label><select id="p-datetype"><option value="ok">正常</option><option value="expired">已过期</option></select></div>
    <div class="form-row"><label>备注</label><input id="p-note" placeholder="选填"></div>
    <div class="form-row"><label>价格标签</label><input id="p-pricelabel" placeholder="留空自动生成"></div>
    <input type="hidden" id="p-edit-id">
    <div class="btn-row">
      <button class="btn btn-outline" onclick="closeModal('modal-product')">取消</button>
      <button class="btn btn-primary" onclick="saveProduct()">保存</button>
    </div>
  </div>
</div>

<!-- ========== 弹窗：选品 ========== -->
<div class="modal-mask" id="modal-pick">
  <div class="modal-card">
    <h2>从商品库选品</h2>
    <div class="product-pick" id="pick-list"></div>
    <div class="btn-row">
      <button class="btn btn-outline" onclick="closeModal('modal-pick')">取消</button>
      <button class="btn btn-primary" onclick="addProductsToCampaign()">加入团单</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ========== 鉴权 ==========
const TOKEN_KEY = 'admin_token';
function getToken() { return localStorage.getItem(TOKEN_KEY); }
function clearAuth() { localStorage.removeItem(TOKEN_KEY); document.getElementById('loginView').style.display = 'flex'; document.getElementById('adminView').classList.remove('show'); }
async function authFetch(url, options = {}) {
  const token = getToken();
  if (!token) { clearAuth(); throw new Error('未登录'); }
  options.headers = options.headers || {};
  options.headers['authorization'] = 'Bearer ' + token;
  if (options.body && typeof options.body === 'object') {
    options.headers['content-type'] = 'application/json';
    options.body = JSON.stringify(options.body);
  }
  const res = await fetch(url, options);
  if (res.status === 401) { clearAuth(); throw new Error('登录过期'); }
  return res.json();
}

async function doLogin() {
  const username = document.getElementById('login-user').value.trim();
  const password = document.getElementById('login-pass').value.trim();
  const data = await (await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username, password }) })).json();
  if (data.error) { showToast(data.error, 'warn'); return; }
  localStorage.setItem(TOKEN_KEY, data.token);
  initAfterLogin();
}

async function doLogout() {
  try { await authFetch('/api/logout', { method: 'POST' }); } catch (e) {}
  clearAuth();
}

async function checkAuth() {
  const token = getToken();
  if (!token) { clearAuth(); return; }
  try {
    const data = await authFetch('/api/me');
    if (data.ok) { initAfterLogin(data.username); }
    else { clearAuth(); }
  } catch (e) { clearAuth(); }
}

function initAfterLogin(username) {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('adminView').classList.add('show');
  document.getElementById('user-chip').textContent = username || 'admin';
  loadCampaigns();
  loadProducts();
}

// ========== Tab 切换 ==========
function switchTab(name) {
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'campaigns') loadCampaigns();
  if (name === 'products') loadProducts();
  if (name === 'orders') loadOrderCampaigns();
}

// ========== 团单管理 ==========
let currentCampaignDetail = null;

async function loadCampaigns() {
  const data = await authFetch('/api/campaigns');
  if (data.error) { showToast(data.error, 'warn'); return; }
  renderCampaignList(data.campaigns || []);
}

function renderCampaignList(campaigns) {
  const el = document.getElementById('campaign-list');
  if (campaigns.length === 0) {
    el.innerHTML = '<div class="empty-state">暂无团单，点击右上角创建</div>';
    return;
  }
  el.innerHTML = campaigns.map(c => {
    const sc = c.status === 'active' ? 'status-active' : c.status === 'closed' ? 'status-closed' : 'status-fulfilled';
    const st = c.status === 'active' ? '进行中' : c.status === 'closed' ? '已截单' : '已履约';
    return `<div class="campaign-row" onclick="openCampaignDetail(${c.id})">
      <div class="cr-top">
        <span class="cr-name">${escapeHtml(c.name)}</span>
        <span class="status-badge ${sc}">${st}</span>
      </div>
      <div class="cr-meta">
        <span>${c.productCount || 0} 款商品</span>
        <span>${c.orderCount || 0} 单</span>
        <span>${c.startTime || ''}</span>
        ${c.endTime ? `<span>截单: ${c.endTime}</span>` : ''}
      </div>
      ${c.description ? `<div style="font-size:12px;color:var(--muted);margin-top:6px;">${escapeHtml(c.description)}</div>` : ''}
    </div>`;
  }).join('');
}

async function openCampaignDetail(id) {
  const data = await authFetch(`/api/campaign?id=${id}`);
  if (data.error) { showToast(data.error, 'warn'); return; }
  currentCampaignDetail = data;
  document.getElementById('campaign-list-view').style.display = 'none';
  document.getElementById('campaign-detail-view').style.display = 'block';
  renderCampaignDetail();
}

function renderCampaignDetail() {
  const { campaign, products, stock } = currentCampaignDetail;
  const sc = campaign.status === 'active' ? 'status-active' : campaign.status === 'closed' ? 'status-closed' : 'status-fulfilled';
  const st = campaign.status === 'active' ? '进行中' : campaign.status === 'closed' ? '已截单' : '已履约';

  let html = `
    <div class="detail-back" onclick="closeCampaignDetail()">‹ 返回团单列表</div>
    <div class="detail-header">
      <h2>${escapeHtml(campaign.name)}</h2>
      <div class="meta">
        <span class="status-badge ${sc}">${st}</span>
        <span>开始: ${campaign.startTime || '-'}</span>
        ${campaign.endTime ? `<span>截单: ${campaign.endTime}</span>` : '<span>无截单时间</span>'}
        <span>${products.length} 款商品</span>
      </div>
      ${campaign.description ? `<div style="font-size:13px;color:var(--muted);margin-top:8px;">${escapeHtml(campaign.description)}</div>` : ''}
      <div class="detail-actions">
        <button class="btn btn-primary btn-sm" onclick="showPickModal()">+ 选品</button>
        ${campaign.status === 'active' ? `<button class="btn btn-outline btn-sm" onclick="updateCampaignStatus('closed')">截单</button>` : ''}
        ${campaign.status === 'closed' ? `<button class="btn btn-outline btn-sm" onclick="updateCampaignStatus('active')">重新开放</button>` : ''}
        ${campaign.status === 'closed' ? `<button class="btn btn-primary btn-sm" onclick="updateCampaignStatus('fulfilled')">标记履约</button>` : ''}
        <button class="btn btn-outline btn-sm" onclick="switchToOrders(${campaign.id})">查看订单</button>
      </div>
    </div>
    <div class="section-title">商品与优惠配置</div>
  `;

  if (products.length === 0) {
    html += '<div class="empty-state">暂无商品，点击"选品"从商品库添加</div>';
  } else {
    html += products.map(p => {
      const remain = stock[p.productId] ?? p.total;
      const rules = p.promotionRules || { type: 'none' };
      const promoTag = rules.type === 'buyGet' ? `<span class="promo-tag promo-buyGet">买${rules.buy}赠${rules.get}</span>` :
                       rules.type === 'tiered' ? `<span class="promo-tag promo-tiered">${rules.tiers.map(t=>`满${t.minQty}件${t.price}元`).join('，')}</span>` : '';
      return `
        <div class="cp-item">
          <div class="cp-top">
            <div class="cp-info">
              <div class="cp-name">${escapeHtml(p.name)} ${promoTag}</div>
              <div class="cp-spec">${p.unit} · ¥${p.price} ${p.step > 1 ? `/ ${p.step}${p.unit}` : ''} ${p.priceLabel ? '· '+escapeHtml(p.priceLabel) : ''}</div>
              ${p.date ? `<div class="cp-spec">${p.dateType==='expired'?'已过期 ':''}${p.date}</div>` : ''}
              <div class="cp-stock"><span class="remain ${remain <= 3 ? 'low' : ''}">剩余 ${remain}</span> / 总量 ${p.total}</div>
              <div class="stock-ctl">
                <button class="minus" onclick="adjStock(${p.productId}, -1)">−</button>
                <input id="stock-input-${p.productId}" value="${remain}" onchange="setStock(${p.productId}, this.value)">
                <button class="plus" onclick="adjStock(${p.productId}, 1)">+</button>
              </div>
            </div>
            <button class="btn btn-sm btn-danger" onclick="removeCampaignProduct(${p.productId})">移除</button>
          </div>
          <div class="promo-config">
            <label>优惠规则</label>
            <div class="promo-row">
              <select id="promo-type-${p.productId}" onchange="onPromoTypeChange(${p.productId})">
                <option value="none" ${rules.type==='none'?'selected':''}>无优惠</option>
                <option value="buyGet" ${rules.type==='buyGet'?'selected':''}>买赠</option>
                <option value="tiered" ${rules.type==='tiered'?'selected':''}>阶梯价</option>
              </select>
              <button class="btn btn-sm btn-primary" onclick="savePromotion(${p.productId})">保存</button>
            </div>
            <div id="promo-fields-${p.productId}" style="margin-top:8px;">
              ${renderPromoFields(p.productId, rules)}
            </div>
          </div>
        </div>`;
    }).join('');
  }

  document.getElementById('campaign-detail-view').innerHTML = html;
}

function renderPromoFields(productId, rules) {
  if (rules.type === 'buyGet') {
    return `<div class="promo-row">
      <input id="promo-buy-${productId}" type="number" value="${rules.buy||2}" style="width:60px;" placeholder="买">
      <span style="font-size:13px;color:var(--muted);">件 赠</span>
      <input id="promo-get-${productId}" type="number" value="${rules.get||1}" style="width:60px;" placeholder="赠">
      <span style="font-size:13px;color:var(--muted);">件</span>
    </div>`;
  }
  if (rules.type === 'tiered') {
    const tiers = rules.tiers || [{ minQty: 5, price: 0 }];
    return `<div class="promo-tiers" id="promo-tiers-${productId}">
      ${tiers.map((t, i) => `<div class="promo-tier-row">
        <span style="font-size:12px;color:var(--muted);">满</span>
        <input type="number" value="${t.minQty}" placeholder="数量" class="tier-min">
        <span style="font-size:12px;color:var(--muted);">件，单价</span>
        <input type="number" step="0.01" value="${t.price}" placeholder="价格" class="tier-price">
        <button onclick="this.parentElement.remove()">×</button>
      </div>`).join('')}
    </div>
    <button class="btn btn-sm btn-outline" onclick="addTier(${productId})" style="margin-top:4px;">+ 添加阶梯</button>`;
  }
  return '';
}

function onPromoTypeChange(productId) {
  const type = document.getElementById(`promo-type-${productId}`).value;
  const rules = type === 'none' ? { type: 'none' } :
    type === 'buyGet' ? { type: 'buyGet', buy: 2, get: 1 } :
    { type: 'tiered', tiers: [{ minQty: 5, price: 0 }] };
  document.getElementById(`promo-fields-${productId}`).innerHTML = renderPromoFields(productId, rules);
}

function addTier(productId) {
  const container = document.getElementById(`promo-tiers-${productId}`);
  const div = document.createElement('div');
  div.className = 'promo-tier-row';
  div.innerHTML = `<span style="font-size:12px;color:var(--muted);">满</span>
    <input type="number" placeholder="数量" class="tier-min">
    <span style="font-size:12px;color:var(--muted);">件，单价</span>
    <input type="number" step="0.01" placeholder="价格" class="tier-price">
    <button onclick="this.parentElement.remove()">×</button>`;
  container.appendChild(div);
}

async function savePromotion(productId) {
  const type = document.getElementById(`promo-type-${productId}`).value;
  let rules = { type: 'none' };
  if (type === 'buyGet') {
    const buy = Number(document.getElementById(`promo-buy-${productId}`).value) || 2;
    const get = Number(document.getElementById(`promo-get-${productId}`).value) || 1;
    rules = { type: 'buyGet', buy, get };
  } else if (type === 'tiered') {
    const tierRows = document.querySelectorAll(`#promo-tiers-${productId} .promo-tier-row`);
    const tiers = [];
    tierRows.forEach(row => {
      const minQty = Number(row.querySelector('.tier-min').value);
      const price = Number(row.querySelector('.tier-price').value);
      if (minQty > 0 && price >= 0) tiers.push({ minQty, price });
    });
    if (tiers.length === 0) { showToast('请至少添加一个阶梯', 'warn'); return; }
    rules = { type: 'tiered', tiers };
  }

  const data = await authFetch('/api/campaignProducts', {
    method: 'PUT',
    body: { campaignId: currentCampaignDetail.campaign.id, productId, promotionRules: rules }
  });
  if (data.error) { showToast(data.error, 'warn'); return; }
  showToast('优惠规则已保存', 'success');
  // 更新本地数据
  const p = currentCampaignDetail.products.find(x => x.productId === productId);
  if (p) p.promotionRules = rules;
  renderCampaignDetail();
}

function closeCampaignDetail() {
  document.getElementById('campaign-detail-view').style.display = 'none';
  document.getElementById('campaign-list-view').style.display = 'block';
}

async function updateCampaignStatus(status) {
  const id = currentCampaignDetail.campaign.id;
  const data = await authFetch(`/api/campaign?id=${id}`, { method: 'PUT', body: { status } });
  if (data.error) { showToast(data.error, 'warn'); return; }
  showToast('状态已更新', 'success');
  currentCampaignDetail.campaign.status = status;
  renderCampaignDetail();
  loadCampaigns();
}

async function adjStock(productId, delta) {
  const data = await authFetch('/api/updateStock', {
    method: 'POST',
    body: { campaignId: currentCampaignDetail.campaign.id, id: productId, delta }
  });
  if (data.error) { showToast(data.error, 'warn'); return; }
  currentCampaignDetail.stock = data.stock;
  renderCampaignDetail();
}

async function setStock(productId, val) {
  const data = await authFetch('/api/updateStock', {
    method: 'POST',
    body: { campaignId: currentCampaignDetail.campaign.id, id: productId, set: Number(val) }
  });
  if (data.error) { showToast(data.error, 'warn'); return; }
  currentCampaignDetail.stock = data.stock;
}

async function removeCampaignProduct(productId) {
  if (!confirm('确定从该团单移除此商品？')) return;
  const data = await authFetch('/api/campaignProducts', {
    method: 'DELETE',
    body: { campaignId: currentCampaignDetail.campaign.id, productId }
  });
  if (data.error) { showToast(data.error, 'warn'); return; }
  showToast('已移除', 'success');
  currentCampaignDetail.products = data.products || [];
  renderCampaignDetail();
}

// ========== 新建团单 ==========
function showCreateCampaignModal() { document.getElementById('modal-campaign').classList.add('show'); }

async function createCampaign() {
  const name = document.getElementById('cp-name').value.trim();
  if (!name) { showToast('请输入团单名称', 'warn'); return; }
  const endTime = document.getElementById('cp-endtime').value;
  const description = document.getElementById('cp-desc').value.trim();
  const data = await authFetch('/api/campaigns', { method: 'POST', body: { name, endTime, description } });
  if (data.error) { showToast(data.error, 'warn'); return; }
  showToast('团单已创建', 'success');
  closeModal('modal-campaign');
  document.getElementById('cp-name').value = '';
  document.getElementById('cp-endtime').value = '';
  document.getElementById('cp-desc').value = '';
  loadCampaigns();
}

// ========== 选品 ==========
async function showPickModal() {
  const baseData = await authFetch('/api/products');
  if (baseData.error) { showToast(baseData.error, 'warn'); return; }
  const existing = new Set(currentCampaignDetail.products.map(p => p.productId));
  const available = baseData.products.filter(p => !existing.has(p.id));

  const el = document.getElementById('pick-list');
  if (available.length === 0) {
    el.innerHTML = '<div class="empty-state">商品库中无可选商品</div>';
  } else {
    el.innerHTML = available.map(p => `
      <div class="product-pick-item">
        <input type="checkbox" value="${p.id}" id="pick-${p.id}">
        <div class="info">
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="spec">${p.unit} · ¥${p.price} ${p.step>1?`/ ${p.step}${p.unit}`:''}</div>
        </div>
      </div>`).join('');
  }
  document.getElementById('modal-pick').classList.add('show');
}

async function addProductsToCampaign() {
  const checked = [...document.querySelectorAll('#pick-list input[type=checkbox]:checked')].map(cb => Number(cb.value));
  if (checked.length === 0) { showToast('请选择商品', 'warn'); return; }
  const data = await authFetch('/api/campaignProducts', {
    method: 'POST',
    body: { campaignId: currentCampaignDetail.campaign.id, productIds: checked }
  });
  if (data.error) { showToast(data.error, 'warn'); return; }
  showToast(`已添加 ${checked.length} 个商品`, 'success');
  closeModal('modal-pick');
  currentCampaignDetail.products = data.products;
  currentCampaignDetail.stock = data.stock;
  renderCampaignDetail();
}

// ========== 商品库 ==========
let baseProducts = [];

async function loadProducts() {
  const data = await authFetch('/api/products');
  if (data.error) { showToast(data.error, 'warn'); return; }
  baseProducts = data.products || [];
  renderProductTable();
}

function renderProductTable() {
  const el = document.getElementById('product-tbody');
  if (baseProducts.length === 0) {
    el.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:20px;">暂无商品</td></tr>';
    return;
  }
  el.innerHTML = baseProducts.map(p => `
    <tr>
      <td>${escapeHtml(p.name)}${p.note?` <span style="color:var(--muted);font-size:11px;">${escapeHtml(p.note)}</span>`:''}</td>
      <td>${p.unit}</td>
      <td>¥${p.price}</td>
      <td>${p.step}</td>
      <td>${p.date||'-'}${p.dateType==='expired'?' <span style="color:var(--danger);">过期</span>':''}</td>
      <td>
        <button class="btn btn-sm btn-outline" onclick="editProduct(${p.id})">编辑</button>
        <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">删除</button>
      </td>
    </tr>`).join('');
}

function showProductModal() {
  document.getElementById('product-modal-title').textContent = '添加商品';
  document.getElementById('p-edit-id').value = '';
  ['p-name','p-unit','p-price','p-step','p-total','p-date','p-note','p-pricelabel'].forEach(id => {
    const el = document.getElementById(id);
    el.value = id === 'p-unit' ? '个' : id === 'p-step' ? '1' : id === 'p-total' ? '0' : '';
  });
  document.getElementById('p-datetype').value = 'ok';
  document.getElementById('modal-product').classList.add('show');
}

function editProduct(id) {
  const p = baseProducts.find(x => x.id === id);
  if (!p) return;
  document.getElementById('product-modal-title').textContent = '编辑商品';
  document.getElementById('p-edit-id').value = id;
  document.getElementById('p-name').value = p.name || '';
  document.getElementById('p-unit').value = p.unit || '个';
  document.getElementById('p-price').value = p.price || 0;
  document.getElementById('p-step').value = p.step || 1;
  document.getElementById('p-total').value = p.total || 0;
  document.getElementById('p-date').value = p.date || '';
  document.getElementById('p-datetype').value = p.dateType || 'ok';
  document.getElementById('p-note').value = p.note || '';
  document.getElementById('p-pricelabel').value = p.priceLabel || '';
  document.getElementById('modal-product').classList.add('show');
}

async function saveProduct() {
  const editId = document.getElementById('p-edit-id').value;
  const body = {
    name: document.getElementById('p-name').value.trim(),
    unit: document.getElementById('p-unit').value.trim(),
    price: Number(document.getElementById('p-price').value),
    step: Number(document.getElementById('p-step').value),
    total: Number(document.getElementById('p-total').value),
    date: document.getElementById('p-date').value.trim(),
    dateType: document.getElementById('p-datetype').value,
    note: document.getElementById('p-note').value.trim(),
    priceLabel: document.getElementById('p-pricelabel').value.trim(),
  };
  if (!body.name) { showToast('请输入商品名称', 'warn'); return; }
  const url = editId ? '/api/updateProduct' : '/api/addProduct';
  if (editId) body.id = Number(editId);
  const data = await authFetch(url, { method: 'POST', body });
  if (data.error) { showToast(data.error, 'warn'); return; }
  showToast(editId ? '已更新' : '已添加', 'success');
  closeModal('modal-product');
  baseProducts = data.products || [];
  renderProductTable();
}

async function deleteProduct(id) {
  if (!confirm('确定删除此商品？')) return;
  const data = await authFetch('/api/deleteProduct', { method: 'POST', body: { id } });
  if (data.error) { showToast(data.error, 'warn'); return; }
  showToast('已删除', 'success');
  baseProducts = data.products || [];
  renderProductTable();
}

// ========== 订单中心 ==========
let orderCampaigns = [];
let currentOrders = [];
let selectedOrders = new Set();
let currentOrdersTab = 'pending';

function switchOrdersTab(tab) {
  currentOrdersTab = tab;
  document.getElementById('orders-tab-pending').classList.toggle('active', tab === 'pending');
  document.getElementById('orders-tab-pickedUp').classList.toggle('active', tab === 'pickedUp');
  document.getElementById('batch-pickup-btn').style.display = tab === 'pending' ? '' : 'none';
  document.getElementById('batch-cancel-btn').style.display = tab === 'pickedUp' ? '' : 'none';
  selectedOrders.clear();
  renderOrders();
}

async function loadOrderCampaigns() {
  const data = await authFetch('/api/campaigns');
  if (data.error) return;
  orderCampaigns = data.campaigns || [];
  const sel = document.getElementById('order-campaign-select');
  sel.innerHTML = orderCampaigns.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  if (orderCampaigns.length > 0) loadCampaignOrders();
}

async function loadCampaignOrders() {
  const campaignId = Number(document.getElementById('order-campaign-select').value);
  if (!campaignId) return;
  const data = await authFetch(`/api/campaignOrders?campaignId=${campaignId}`);
  if (data.error) { showToast(data.error, 'warn'); return; }
  currentOrders = data.orders || [];
  selectedOrders.clear();
  currentOrdersTab = 'pending';
  document.getElementById('orders-tab-pending').classList.add('active');
  document.getElementById('orders-tab-pickedUp').classList.remove('active');
  document.getElementById('batch-pickup-btn').style.display = '';
  document.getElementById('batch-cancel-btn').style.display = 'none';
  renderKPI();
  renderOrders();
}

function renderKPI() {
  const total = currentOrders.length;
  const pending = currentOrders.filter(o => !o.pickedUp).length;
  const pickedUp = currentOrders.filter(o => o.pickedUp).length;
  const totalAmount = currentOrders.reduce((s, o) => s + (o.total || 0), 0);
  document.getElementById('order-kpi').innerHTML = `
    <div class="kpi-card"><div class="kpi-label">总订单</div><div class="kpi-value">${total}</div></div>
    <div class="kpi-card"><div class="kpi-label">未取货</div><div class="kpi-value" style="color:var(--warn);">${pending}</div></div>
    <div class="kpi-card"><div class="kpi-label">已取货</div><div class="kpi-value" style="color:var(--success);">${pickedUp}</div></div>
    <div class="kpi-card"><div class="kpi-label">总金额</div><div class="kpi-value">¥${totalAmount.toFixed(2).replace(/\.00$/,'')}</div></div>
  `;
  document.getElementById('orders-count-pending').textContent = pending;
  document.getElementById('orders-count-pickedUp').textContent = pickedUp;
}

function getFilteredOrders() {
  const search = document.getElementById('order-search').value.trim().toLowerCase();
  return currentOrders.filter((o, idx) => {
    if (currentOrdersTab === 'pending' && o.pickedUp) return false;
    if (currentOrdersTab === 'pickedUp' && !o.pickedUp) return false;
    if (search) {
      const match = (o.name||'').toLowerCase().includes(search) || (o.pickupCode||'').toLowerCase().includes(search);
      if (!match) return false;
    }
    return true;
  });
}

function renderOrders() {
  const filtered = getFilteredOrders();
  const el = document.getElementById('order-list');
  if (filtered.length === 0) {
    el.innerHTML = `<div class="empty-state">暂无${currentOrdersTab === 'pending' ? '未取' : '已取'}订单</div>`;
    document.getElementById('batch-bar').classList.remove('show');
    return;
  }

  el.innerHTML = filtered.map(o => {
    const idx = currentOrders.indexOf(o);
    const selected = selectedOrders.has(idx);
    const itemsText = (o.items||[]).map(it => `${it.name} ×${it.qty}${it.gift>0?`(赠${it.gift})`:''}`).join('，');
    return `<div class="order-row ${selected?'selected':''}">
      <div class="order-top">
        <label style="display:flex;align-items:center;gap:8px;">
          <input type="checkbox" ${selected?'checked':''} onchange="toggleSelect(${idx})">
          <span class="order-name">${escapeHtml(o.name)}</span>
        </label>
        <span class="order-code">${o.pickupCode||''}</span>
      </div>
      <div class="order-items">${escapeHtml(itemsText)}</div>
      ${o.note ? `<div class="order-items" style="color:var(--warn);">备注: ${escapeHtml(o.note)}</div>` : ''}
      <div class="order-bottom">
        <span class="order-total">¥${o.total}</span>
        <div class="order-actions">
          <span class="status-badge ${o.pickedUp?'status-fulfilled':'status-active'}">${o.pickedUp?'已取货':'未取货'}</span>
          <button class="btn btn-sm ${o.pickedUp?'btn-outline':'btn-primary'}" onclick="togglePickup(${idx})">${o.pickedUp?'取消取货':'确认取货'}</button>
          <button class="btn btn-sm btn-danger" onclick="deleteOrder(${idx})">删除</button>
        </div>
      </div>
      <div class="order-time">${o.time || ''} ${o.contact||''}</div>
    </div>`;
  }).join('');

  document.getElementById('batch-bar').classList.toggle('show', selectedOrders.size > 0);
  document.getElementById('batch-info').textContent = `已选 ${selectedOrders.size} 单`;
}

function toggleSelect(idx) {
  if (selectedOrders.has(idx)) selectedOrders.delete(idx);
  else selectedOrders.add(idx);
  renderOrders();
}

async function togglePickup(idx) {
  const campaignId = Number(document.getElementById('order-campaign-select').value);
  const order = currentOrders[idx];
  const data = await authFetch('/api/updateOrder', {
    method: 'POST',
    body: { campaignId, idx, pickedUp: !order.pickedUp }
  });
  if (data.error) { showToast(data.error, 'warn'); return; }
  currentOrders[idx] = data.order;
  renderKPI();
  renderOrders();
}

async function deleteOrder(idx) {
  if (!confirm('确定删除此订单？')) return;
  const campaignId = Number(document.getElementById('order-campaign-select').value);
  const data = await authFetch('/api/batchUpdate', {
    method: 'POST',
    body: { campaignId, action: 'delete', indices: [idx] }
  });
  if (data.error) { showToast(data.error, 'warn'); return; }
  currentOrders = data.orders;
  selectedOrders.clear();
  renderKPI();
  renderOrders();
}

async function batchAction(action) {
  const campaignId = Number(document.getElementById('order-campaign-select').value);
  const indices = [...selectedOrders];
  const data = await authFetch('/api/batchUpdate', {
    method: 'POST',
    body: { campaignId, action, indices }
  });
  if (data.error) { showToast(data.error, 'warn'); return; }
  showToast(`已处理 ${data.affected} 单`, 'success');
  currentOrders = data.orders;
  selectedOrders.clear();
  renderKPI();
  renderOrders();
}

function switchToOrders(campaignId) {
  switchTab('orders');
  setTimeout(() => {
    document.getElementById('order-campaign-select').value = campaignId;
    loadCampaignOrders();
  }, 100);
}

// ========== CSV 导出 ==========
function exportCSV() {
  if (currentOrders.length === 0) { showToast('暂无订单可导出', 'warn'); return; }
  const headers = ['取货码', '姓名', '联系方式', '商品明细', '订购数量', '赠品数量', '实付金额', '下单时间', '取货状态', '取货时间', '备注'];
  const rows = currentOrders.map(o => {
    const items = (o.items||[]);
    const itemNames = items.map(it => it.name).join('；');
    const totalQty = items.reduce((s, it) => s + it.qty, 0);
    const totalGift = items.reduce((s, it) => s + (it.gift||0), 0);
    return [
      o.pickupCode || '',
      o.name || '',
      o.contact || '',
      itemNames,
      totalQty,
      totalGift,
      o.total || 0,
      o.time || '',
      o.pickedUp ? '已取货' : '未取货',
      o.pickedUpAt || '',
      o.note || ''
    ];
  });
  const csv = '\uFEFF' + [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const campaignName = orderCampaigns.find(c => c.id === Number(document.getElementById('order-campaign-select').value))?.name || '团单';
  a.download = `${campaignName}_订单明细_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('已导出', 'success');
}

// ========== 工具 ==========
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}
function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

// ========== 初始化 ==========
checkAuth();
</script>
